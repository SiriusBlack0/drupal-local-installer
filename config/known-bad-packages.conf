# Releases of packages known to break a Drupal project, so that Composer
# never picks them where they break. Data, not code: when a fixed release
# is out, change only this file.
#
# Before "composer require drush/drush" of a new project (native and
# DDEV), each line whose condition holds for the packages just installed
# (composer.lock) becomes a "conflict" in the project's composer.json,
# shown as [WORKAROUND] and committed with the project (easy to see and
# to remove). --check-updates warns about projects whose composer.lock
# has such a release.
#
# Format (fields separated by "|", spaces around them are ignored):
# package | bad versions | condition | why
#   bad versions: one or more of >=X >X <=X <X =X or X, separated by
#                 spaces, all of which must hold (a Composer range)
#   condition:    "always", or "<package> <op> <version>" checked against
#                 the installed version of that package (op: < <= > >= =)
#
# consolidation/robo 5.2.0-5.2.3 (November 2026): Robo calls
# Application::addCommand(), which only Symfony Console 7.4+ has, but it
# declares symfony/console ^6 || ^7 || ^8. Drupal 10.5 has Console 6.4,
# so Drush 13 does not start. 5.2.2 also ships merge conflict markers.
consolidation/robo | >=5.2.0 <5.3 | symfony/console < 7.4 | Robo 5.2 needs Symfony Console 7.4+ (Application::addCommand) but declares ^6; Drush does not start
consolidation/robo | 5.2.2 | always | the 5.2.2 release has merge conflict markers in src/Robo.php
