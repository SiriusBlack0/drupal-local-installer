# Major upgrades (./install.sh --upgrade NAME) — one line per step.
#
# Sources (checked 2026-10-19):
#   Drupal 11: https://www.drupal.org/docs/upgrading-drupal (updates from 10.3 on;
#              Drush 13; Actions UI, Activity Tracker, Book, Forum, Statistics
#              and Tour left core for drupal.org projects of the same name)
#   Drupal 12: release notes of 12.0.0-beta1 (updates from 11.3 on; modules and
#              themes removed from core). Used only once a stable 12.x release
#              exists and its minor is in compatibility.conf.
#   Upgrade Status: https://www.drupal.org/project/upgrade_status
#              (4.x checks Drupal 10 sites for 11; 5.x checks 11 for 12)
#
# Format (no spaces):
# from_major|to_major|minimum_from_minor|drush_constraint|upgrade_status_constraint|removed_from_core
#   drush_constraint: written for drush/drush when composer.json requires it
#                     (empty: the project's constraint is kept)
#   removed_from_core: modules and themes the new major no longer has in core
10|11|10.3|^13|^4.3|action,book,forum,statistics,tour,tracker
11|12|11.3||^5.0@alpha|ban,contact,field_layout,history,search,settings_tray,shortcut,telephone,toolbar,migrate_drupal,migrate_drupal_ui,claro,olivero,stable9
